<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>قائمة المهام والمواعيد</title>
<style>
  body { font-family: Segoe UI, Tahoma, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
  header { background: #2b6cb0; color: #fff; padding: 16px; text-align: center; font-size: 20px; }
  .form { display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #fff; }
  .form input, .form select, .form button { padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
  .form button { background: #2b6cb0; color: #fff; border: none; cursor: pointer; }
  .form button.secondary { background: #fff; color: #2b6cb0; border: 1px solid #2b6cb0; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  ul { list-style: none; margin: 0; padding: 12px; }
  li { background: #fff; margin-bottom: 8px; padding: 10px 12px; border-radius: 8px;
       display: flex; align-items: center; gap: 10px; border-right: 5px solid #2b6cb0; }
  li.done { opacity: .55; border-right-color: #38a169; }
  li.done .title { text-decoration: line-through; }
  li.late { border-right-color: #e53e3e; }
  .info { flex: 1; }
  .when { font-size: 13px; color: #666; }
  .del { background: none; border: none; color: #e53e3e; font-size: 18px; cursor: pointer; }
  .empty { text-align: center; color: #888; padding: 24px; }
</style>
</head>
<body>
<header>قائمتي ✔</header>

<div class="form">
  <input id="title" placeholder="عنوان المهمة أو الموعد">
  <div class="row">
    <input id="date" type="date">
    <input id="time" type="time">
  </div>
  <select id="remind">
    <option value="0">التذكير في الموعد نفسه</option>
    <option value="10">قبل 10 دقائق</option>
    <option value="60">قبل ساعة</option>
    <option value="1440">قبل يوم</option>
  </select>
  <button id="add">إضافة</button>
  <button id="test" class="secondary">اختبار الإشعار</button>
</div>

<ul id="list"></ul>

<script>
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

function save() { localStorage.setItem('tasks', JSON.stringify(tasks)); }

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!tasks.length) {
    list.innerHTML = '<div class="empty">لا توجد مهام بعد</div>';
    return;
  }
  const sorted = [...tasks].sort((a, b) => new Date(a.due) - new Date(b.due));
  const now = new Date();
  sorted.forEach(t => {
    const li = document.createElement('li');
    const late = !t.done && new Date(t.due) < now;
    li.className = (t.done ? 'done ' : '') + (late ? 'late' : '');
    li.innerHTML = `
      <input type="checkbox" ${t.done ? 'checked' : ''}>
      <div class="info">
        <div class="title">${t.title.replace(/</g, '&lt;')}</div>
        <div class="when">${new Date(t.due).toLocaleString('ar-DZ')}</div>
      </div>
      <button class="del">🗑</button>`;
    li.querySelector('input').onchange = () => { t.done = !t.done; save(); render(); };
    li.querySelector('.del').onclick = () => { tasks = tasks.filter(x => x.id !== t.id); save(); render(); };
    list.appendChild(li);
  });
}

document.getElementById('add').onclick = () => {
  const title = document.getElementById('title').value.trim();
  const date = document.getElementById('date').value;
  const time = document.getElementById('time').value || '09:00';
  const remind = parseInt(document.getElementById('remind').value, 10);
  if (!title || !date) { alert('أدخل العنوان والتاريخ'); return; }
  tasks.push({ id: Date.now(), title, due: `${date}T${time}`, remind, done: false, notified: false });
  save(); render();
  document.getElementById('title').value = '';
};

document.getElementById('test').onclick = () => {
  window.api.notify('اختبار', 'هل يظهر الإشعار؟');
};

function checkReminders() {
  const now = new Date();
  tasks.forEach(t => {
    if (t.done || t.notified) return;
    const fireAt = new Date(new Date(t.due).getTime() - t.remind * 60000);
    if (now >= fireAt) {
      window.api.notify('تذكير بموعد', `${t.title} — ${new Date(t.due).toLocaleString('ar-DZ')}`);
      t.notified = true;
      save();
    }
  });
  render();
}

setInterval(checkReminders, 30000);
checkReminders();
render();
</script>
</body>
</html>
